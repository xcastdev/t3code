buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.t3tools.nativecontrols'
version = '0.0.0'

android {
  namespace 'expo.modules.t3nativecontrols'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
  }
  buildFeatures { compose true }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation 'androidx.activity:activity:1.8.2'
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha17'
  implementation 'androidx.window:window:1.5.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation project(':expo-secure-store')
  testImplementation 'org.json:json:20240303'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
  testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}

tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}
