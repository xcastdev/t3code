<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request Inspector</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: var(--color-background-primary, #0f0f10);
        --surface: var(--color-background-secondary, #18181b);
        --muted: var(--color-background-tertiary, #232327);
        --text: var(--color-text-primary, #ededef);
        --text-muted: var(--color-text-secondary, #9a9aa3);
        --text-faint: var(--color-text-tertiary, #6e6e76);
        --border: var(--color-border-primary, #2c2c31);
        --input-border: var(--color-border-secondary, #34343a);
        --danger: var(--color-text-danger, #f87171);
        --danger-bg: var(--color-background-danger, rgba(248, 113, 113, 0.1));
        --warning: var(--color-text-warning, #fbbf24);
        --warning-bg: var(--color-background-warning, rgba(251, 191, 36, 0.1));
        --success: var(--color-text-success, #4ade80);
        --info: var(--color-text-info, #60a5fa);
        --ring: var(--color-ring-primary, #6b8afd);
        --radius: var(--border-radius-md, 8px);
        --sans: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
        --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: var(--color-background-primary, #ffffff);
        --surface: var(--color-background-secondary, #f7f7f8);
        --muted: var(--color-background-tertiary, #efeff1);
        --text: var(--color-text-primary, #18181b);
        --text-muted: var(--color-text-secondary, #6b6b73);
        --text-faint: var(--color-text-tertiary, #8b8b93);
        --border: var(--color-border-primary, #e4e4e7);
        --input-border: var(--color-border-secondary, #d4d4d8);
        --danger: var(--color-text-danger, #dc2626);
        --danger-bg: var(--color-background-danger, rgba(220, 38, 38, 0.08));
        --warning: var(--color-text-warning, #b45309);
        --warning-bg: var(--color-background-warning, rgba(180, 83, 9, 0.08));
        --success: var(--color-text-success, #16a34a);
        --info: var(--color-text-info, #2563eb);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 var(--sans);
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: var(--text);
      }
      button {
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--input-border);
        border-radius: calc(var(--radius) - 2px);
        background: var(--surface);
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        background: var(--muted);
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      button.primary {
        border-color: transparent;
        background: var(--text);
        color: var(--bg);
      }
      button.primary:hover:not(:disabled) {
        background: var(--text);
        opacity: 0.9;
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--text-muted);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      input,
      select,
      textarea {
        min-width: 0;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--input-border);
        border-radius: calc(var(--radius) - 2px);
        background: var(--surface);
      }
      textarea {
        width: 100%;
        height: auto;
        min-height: 72px;
        padding: 6px 8px;
        font: 12px/1.5 var(--mono);
        resize: vertical;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .spacer {
        flex: 1;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }
      .muted {
        color: var(--text-muted);
      }
      .faint {
        color: var(--text-faint);
      }
      .notice {
        padding: 6px 8px;
        border-radius: calc(var(--radius) - 2px);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .notice.warn {
        background: var(--warning-bg);
        color: var(--warning);
      }
      .notice.error {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .notices {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 12px 0;
      }
      .notices:empty {
        display: none;
      }
      .empty {
        padding: 24px 16px;
        color: var(--text-muted);
        text-align: center;
      }
      .s2 {
        color: var(--success);
      }
      .s3 {
        color: var(--info);
      }
      .s4 {
        color: var(--warning);
      }
      .s5 {
        color: var(--danger);
      }
      .state-pending {
        color: var(--info);
      }
      .state-completed {
        color: var(--success);
      }
      .state-failed {
        color: var(--danger);
      }
      .state-maybe {
        color: var(--warning);
      }
      label.check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-muted);
        font-size: 12px;
      }
      label.check input {
        height: auto;
      }
    </style>
  </head>
  <body>
    <nav class="topnav" id="nav" aria-label="Inspector views"></nav>
    <div class="notices" id="notices"></div>
    <div id="views" class="view"></div>
  </body>
</html>
